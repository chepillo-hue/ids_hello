<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Transaccional API - Efectos Especiales</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 1. EFECTO BORDES BRILANTES Y NEÓN (GLOW CARD) --- */
        .glow-card {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .glow-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 0deg 340deg, #ec4899 360deg);
            animation: rotateGlow 6s linear infinite;
            z-index: -2;
        }

        .glow-card::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0f172a;
            border-radius: 1.4rem;
            z-index: -1;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- 2. MICROANIMACIÓN DE ERROR (SHAKE) --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        /* --- 3. TOAST NOTIFICATION SLIDE --- */
        @keyframes toastIn {
            from { transform: translateY(100%) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .toast-animate {
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- CONTENEDOR PRINCIPAL CON EFECTO DE LUZ -->
    <div id="card-container" class="glow-card w-full max-w-lg p-6 sm:p-8 shadow-2xl transition-all">
        
        <!-- ENCABEZADO -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-pink-500/10 border border-pink-500/30 flex items-center justify-center text-pink-500 text-lg">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-white">Nuevo Producto / Perfume</h2>
                    <p class="text-xs text-slate-400">Transacción POST directa a la API</p>
                </div>
            </div>
            <span class="text-[10px] uppercase font-mono tracking-wider bg-pink-500/20 text-pink-400 border border-pink-500/30 px-2.5 py-1 rounded-full">
                Live API
            </span>
        </div>

        <!-- FORMULARIO TRANSACCIONAL -->
        <form id="form-transaccion" onsubmit="enviarTransaccion(event)" class="space-y-4">
            
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre del Perfume</label>
                <div class="relative">
                    <i class="fa-solid fa-bottle-droplet absolute left-3 top-3 text-slate-500 text-sm"></i>
                    <input type="text" id="nombre" required placeholder="Ej. Sauvage Elixir" 
                        class="w-full pl-9 pr-3 py-2 bg-slate-900/90 text-white rounded-xl border border-slate-700/80 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 text-sm focus:outline-none transition-all">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Marca</label>
                    <input type="text" id="marca" required placeholder="Dior" 
                        class="w-full px-3 py-2 bg-slate-900/90 text-white rounded-xl border border-slate-700/80 focus:border-pink-500 text-sm focus:outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Concentración</label>
                    <select id="concentracion" class="w-full px-3 py-2 bg-slate-900/90 text-white rounded-xl border border-slate-700/80 focus:border-pink-500 text-sm focus:outline-none transition-all">
                        <option value="Parfum">Parfum</option>
                        <option value="Eau de Parfum">Eau de Parfum</option>
                        <option value="Eau de Toilette">Eau de Toilette</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Precio Venta ($)</label>
                    <input type="number" step="0.01" id="precio_venta" required placeholder="120.00" 
                        class="w-full px-3 py-2 bg-slate-900/90 text-white rounded-xl border border-slate-700/80 focus:border-pink-500 text-sm focus:outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Stock Inicial</label>
                    <input type="number" id="stock" required placeholder="15" 
                        class="w-full px-3 py-2 bg-slate-900/90 text-white rounded-xl border border-slate-700/80 focus:border-pink-500 text-sm focus:outline-none transition-all">
                </div>
            </div>

            <!-- BOTÓN MULTI-ESTADO ANIMADO -->
            <div class="pt-3">
                <button type="submit" id="btn-submit" 
                    class="w-full relative py-3 px-4 bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600 hover:from-pink-600 hover:to-rose-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-pink-500/25 transition-all duration-300 flex items-center justify-center space-x-2 overflow-hidden">
                    
                    <!-- Icono / Spinner -->
                    <span id="btn-icon">
                        <i class="fa-solid fa-paper-plane"></i>
                    </span>
                    <span id="btn-text">Registrar Transacción</span>
                </button>
            </div>
        </form>
    </div>

    <!-- TOAST NOTIFICATION FLOTANTE (ESTILO SONNER) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <!-- LÓGICA DE TRANSACCIÓN Y EFECTOS -->
    <script>
        async function enviarTransaccion(event) {
            event.preventDefault();

            const btn = document.getElementById('btn-submit');
            const btnIcon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');
            const card = document.getElementById('card-container');

            // Payload para la API
            const payload = {
                sku: "SKU-" + Math.floor(1000 + Math.random() * 9000),
                nombre: document.getElementById('nombre').value,
                marca: document.getElementById('marca').value,
                genero: "Unisex",
                familia: "Cítrica / Amaderada",
                concentracion: document.getElementById('concentracion').value,
                precio_costo: parseFloat(document.getElementById('precio_venta').value) * 0.6,
                precio_venta: parseFloat(document.getElementById('precio_venta').value),
                stock: parseInt(document.getElementById('stock').value)
            };

            // 1. ESTADO: CARGANDO (Transición en botón)
            btn.disabled = true;
            btn.className = "w-full py-3 px-4 bg-slate-800 text-pink-400 font-bold text-sm rounded-xl border border-pink-500/40 flex items-center justify-center space-x-2 transition-all cursor-wait";
            btnIcon.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;
            btnText.innerText = "Procesando en API...";

            mostrarToast("loading", "Enviando transacción a /api/catalogos/perfumes...");

            try {
                const response = await fetch('/api/catalogos/perfumes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP Error Status: ${response.status}`);
                const data = await response.json();

                // 2. ESTADO: ÉXITO
                btn.className = "w-full py-3 px-4 bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2 transition-all";
                btnIcon.innerHTML = `<i class="fa-solid fa-check text-lg"></i>`;
                btnText.innerText = "¡Transacción Exitosa!";

                mostrarToast("success", `Producto "${payload.nombre}" registrado en la BD`);
                document.getElementById('form-transaccion').reset();

            } catch (error) {
                // 3. ESTADO: ERROR (Efecto Shake)
                card.classList.add('shake-animation');
                setTimeout(() => card.classList.remove('shake-animation'), 400);

                btn.className = "w-full py-3 px-4 bg-red-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center space-x-2 transition-all";
                btnIcon.innerHTML = `<i class="fa-solid fa-xmark text-lg"></i>`;
                btnText.innerText = "Error en Servidor";

                mostrarToast("error", `Fallo en transacción: ${error.message}`);
            } finally {
                // Restaurar estado original del botón a los 2.5 segundos
                setTimeout(() => {
                    btn.disabled = false;
                    btn.className = "w-full relative py-3 px-4 bg-gradient-to-r from-pink-500 via-rose-500 to-pink-600 hover:from-pink-600 hover:to-rose-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-pink-500/25 transition-all duration-300 flex items-center justify-center space-x-2 overflow-hidden";
                    btnIcon.innerHTML = `<i class="fa-solid fa-paper-plane"></i>`;
                    btnText.innerText = "Registrar Transacción";
                }, 2500);
            }
        }

        // SISTEMA DE NOTIFICACIONES TOAST (TIPO SONNER)
        function mostrarToast(tipo, mensaje) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let iconHTML = '<i class="fa-solid fa-circle-notch fa-spin text-pink-400"></i>';
            let borderClass = 'border-pink-500/40';

            if (tipo === 'success') {
                iconHTML = '<i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>';
                borderClass = 'border-emerald-500/40';
            } else if (tipo === 'error') {
                iconHTML = '<i class="fa-solid fa-triangle-exclamation text-red-400 text-base"></i>';
                borderClass = 'border-red-500/40';
            }

            toast.className = `toast-animate bg-slate-900/95 backdrop-blur-md text-slate-100 px-4 py-3 rounded-xl border ${borderClass} shadow-xl flex items-center space-x-3 text-xs max-w-xs`;
            toast.innerHTML = `
                <div>${iconHTML}</div>
                <div class="flex-1 font-medium">${mensaje}</div>
            `;

            container.appendChild(toast);

            // Desaparecer automáticamente
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>
</html>
