<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Perfumería</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- AG Grid -->
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Layout Principal -->
  <div class="flex h-screen overflow-hidden">
    
    <!-- Sidebar / Menú Lateral -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
      <div class="p-5 font-bold text-xl border-b border-slate-800 flex items-center gap-2">
        <span>🌸</span> ERP Perfumería
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="#" onclick="cambiarModulo('perfumes')" class="block py-2.5 px-4 rounded bg-indigo-600 hover:bg-indigo-700 transition">
          🧪 Catálogo Perfumes
        </a>
        <a href="#" onclick="alert('Módulo de Ventas en desarrollo...')" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition text-gray-400">
          🛒 Ventas (Próximamente)
        </a>
        <a href="#" onclick="alert('Módulo de Inventario en desarrollo...')" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition text-gray-400">
          📦 Inventario (Próximamente)
        </a>
      </nav>
      <div class="p-4 text-xs text-slate-500 border-t border-slate-800">
        v1.0.0 — Despliegue Render
      </div>
    </aside>

    <!-- Áreas de Contenido Principal -->
    <main class="flex-1 flex flex-col overflow-y-auto">
      
      <!-- Topbar / Navbar Móvil -->
      <header class="bg-white shadow-sm p-4 flex justify-between items-center md:justify-end">
        <h1 class="text-lg font-bold md:hidden">🌸 Perfumería ERP</h1>
        <button onclick="abrirModalCrear()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
          + Nuevo Perfume
        </button>
      </header>

      <!-- Vista de Contenido -->
      <div class="p-6 flex-1">
        <div class="mb-4 flex justify-between items-center">
          <h2 class="text-2xl font-bold text-gray-800">Catálogo de Perfumes</h2>
        </div>

        <!-- Tabla AG Grid (Escritorio) -->
        <div id="gridContainer" class="hidden md:block ag-theme-alpine w-full h-[500px] shadow rounded-lg overflow-hidden"></div>

        <!-- Vista Tarjetas (Móvil) -->
        <div id="mobileContainer" class="block md:hidden space-y-4"></div>
      </div>
    </main>

  </div>

  <!-- Modal para Crear / Editar Perfume -->
  <div id="modalForm" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
      <h3 class="text-lg font-bold mb-4" id="modalTitulo">Agregar Perfume</h3>
      <form id="perfumeForm" onsubmit="guardarPerfume(event)" class="space-y-3">
        <input type="hidden" id="perfumeId">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500">Nombre</label>
          <input type="text" id="nombre" required class="w-full border p-2 rounded mt-1">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500">Marca</label>
          <input type="text" id="marca" required class="w-full border p-2 rounded mt-1">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500">Precio ($)</label>
          <input type="number" step="0.01" id="precio" required class="w-full border p-2 rounded mt-1">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let gridApi = null;

    // Configuración de AG Grid
    const columnDefs = [
      { field: "id", headerName: "ID", width: 80 },
      { field: "nombre", headerName: "Nombre Perfume", flex: 1 },
      { field: "marca", headerName: "Marca", flex: 1 },
      { field: "precio", headerName: "Precio ($)", width: 120 },
      {
        headerName: "Acciones",
        width: 150,
        cellRenderer: (params) => `
          <button onclick="eliminarPerfume(${params.data.id})" class="text-red-600 hover:underline text-xs mr-2">Eliminar</button>
        `
      }
    ];

    async function cargarPerfumes() {
      const res = await fetch('/api/catalogos/perfumes');
      const data = await res.json();
      
      // Cargar en AG Grid
      if (gridApi) {
        gridApi.setGridOption('rowData', data);
      } else {
        const gridDiv = document.querySelector('#gridContainer');
        gridApi = agGrid.createGrid(gridDiv, {
          columnDefs: columnDefs,
          rowData: data,
          pagination: true
        });
      }

      // Cargar en vista Móvil
      const mobileDiv = document.getElementById('mobileContainer');
      mobileDiv.innerHTML = data.map(p => `
        <div class="bg-white p-4 rounded-lg shadow border border-gray-100 flex justify-between items-center">
          <div>
            <h4 class="font-bold text-gray-900">${p.nombre}</h4>
            <p class="text-sm text-gray-500">${p.marca} - <span class="font-semibold text-emerald-600">$${p.precio}</span></p>
          </div>
          <button onclick="eliminarPerfume(${p.id})" class="text-red-500 p-2">🗑️</button>
        </div>
      `).join('');
    }

    async function guardarPerfume(e) {
      e.preventDefault();
      const perfume = {
        nombre: document.getElementById('nombre').value,
        marca: document.getElementById('marca').value,
        precio: parseFloat(document.getElementById('precio').value)
      };

      await fetch('/api/catalogos/perfumes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(perfume)
      });

      cerrarModal();
      cargarPerfumes();
    }

    async function eliminarPerfume(id) {
      if (confirm('¿Eliminar este perfume?')) {
        await fetch(`/api/catalogos/perfumes/${id}`, { method: 'DELETE' });
        cargarPerfumes();
      }
    }

    function abrirModalCrear() {
      document.getElementById('perfumeForm').reset();
      document.getElementById('modalForm').classList.remove('hidden');
      document.getElementById('modalForm').classList.add('flex');
    }

    function cerrarModal() {
      document.getElementById('modalForm').classList.add('hidden');
      document.getElementById('modalForm').classList.remove('flex');
    }

    document.addEventListener('DOMContentLoaded', cargarPerfumes);
  </script>
</body>
</html>
