<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Perfumería - Sistema de Gestión</title>

    <!-- Tailwind CSS (Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- AG Grid Community CSS + JS -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>

    <!-- FontAwesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

    <!-- 1. BARRA SUPERIOR DE NAVEGACIÓN (HEADER) -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-bottle-droplet text-pink-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Perfumería ERP</h1>
            </div>
            <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">
                <i class="fa-solid fa-database text-green-400 mr-1"></i> PostgreSQL Online
            </span>
        </div>

        <!-- MENU PRINCIPAL / PESTAÑAS Y SUBMENÚS -->
        <nav class="bg-slate-800 border-t border-slate-700">
            <div class="container mx-auto flex flex-wrap gap-1 px-4 text-sm font-medium">

                <!-- GRUPO: CATÁLOGOS BASE -->
                <div class="relative group">
                    <button class="flex items-center space-x-2 px-4 py-3 hover:bg-slate-700 text-slate-200 focus:outline-none">
                        <i class="fa-solid fa-folder text-amber-400"></i>
                        <span>Catálogos Base</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-1 opacity-70"></i>
                    </button>
                    <!-- Submenú desplegable -->
                    <div class="absolute left-0 top-full hidden group-hover:block w-48 bg-white text-gray-800 shadow-xl rounded-b border z-50">
                        <a href="#" onclick="cargarModulo('marcas')" class="block px-4 py-2 hover:bg-gray-100 flex items-center space-x-2">
                            <i class="fa-solid fa-tags text-indigo-500 w-4"></i><span>Marcas</span>
                        </a>
                        <a href="#" onclick="cargarModulo('familias')" class="block px-4 py-2 hover:bg-gray-100 flex items-center space-x-2">
                            <i class="fa-solid fa-layer-group text-purple-500 w-4"></i><span>Familias Olfativas</span>
                        </a>
                        <a href="#" onclick="cargarModulo('concentraciones')" class="block px-4 py-2 hover:bg-gray-100 flex items-center space-x-2">
                            <i class="fa-solid fa-vial text-teal-500 w-4"></i><span>Concentraciones</span>
                        </a>
                    </div>
                </div>

                <!-- GRUPO: INVENTARIO / PRODUCTOS -->
                <button onclick="cargarModulo('perfumes')" class="flex items-center space-x-2 px-4 py-3 hover:bg-slate-700 text-slate-200">
                    <i class="fa-solid fa-boxes-stacked text-blue-400"></i>
                    <span>Perfumes / Productos</span>
                </button>

                <!-- GRUPO: TERCEROS (CLIENTES Y PROVEEDORES) -->
                <div class="relative group">
                    <button class="flex items-center space-x-2 px-4 py-3 hover:bg-slate-700 text-slate-200 focus:outline-none">
                        <i class="fa-solid fa-users text-emerald-400"></i>
                        <span>Contactos</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-1 opacity-70"></i>
                    </button>
                    <div class="absolute left-0 top-full hidden group-hover:block w-48 bg-white text-gray-800 shadow-xl rounded-b border z-50">
                        <a href="#" onclick="cargarModulo('clientes')" class="block px-4 py-2 hover:bg-gray-100 flex items-center space-x-2">
                            <i class="fa-solid fa-user-tag text-emerald-600 w-4"></i><span>Clientes</span>
                        </a>
                        <a href="#" onclick="cargarModulo('proveedores')" class="block px-4 py-2 hover:bg-gray-100 flex items-center space-x-2">
                            <i class="fa-solid fa-truck-field text-orange-500 w-4"></i><span>Proveedores</span>
                        </a>
                    </div>
                </div>

                <!-- GRUPO: OPERACIONES -->
                <button onclick="cargarModulo('ventas')" class="flex items-center space-x-2 px-4 py-3 hover:bg-slate-700 text-slate-200">
                    <i class="fa-solid fa-cart-shopping text-rose-400"></i>
                    <span>Ventas</span>
                </button>

                <button onclick="cargarModulo('compras')" class="flex items-center space-x-2 px-4 py-3 hover:bg-slate-700 text-slate-200">
                    <i class="fa-solid fa-bag-shopping text-cyan-400"></i>
                    <span>Compras</span>
                </button>

            </div>
        </nav>
    </header>

    <!-- 2. ÁREA PRINCIPAL DE CONTENIDO -->
    <main class="flex-1 p-4 flex flex-col container mx-auto">

        <!-- ENCABEZADO DEL MÓDULO ACTIVO -->
        <div class="bg-white p-4 rounded-t-lg border-b border-gray-200 flex justify-between items-center shadow-sm">
            <div>
                <h2 id="titulo-modulo" class="text-xl font-bold text-gray-800">Perfumes / Productos</h2>
                <p id="subtitulo-modulo" class="text-xs text-gray-500">Listado completo de productos registrados</p>
            </div>
            <div class="flex space-x-2">
                <button onclick="recargarDatos()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded text-sm font-medium flex items-center space-x-1">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Actualizar</span>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE LA TABLA (AG GRID) -->
        <div class="flex-1 bg-white rounded-b-lg shadow-sm p-2 flex flex-col">
            <div id="myGrid" class="ag-theme-alpine w-full h-full" style="min-height: 450px;"></div>
        </div>
    </main>

    <!-- 3. LÓGICA DE JAVASCRIPT -->
    <script>
        let gridApi = null;
        let moduloActual = 'perfumes';

        // Definición de columnas por cada catálogo
        const configuracionColumnas = {
            perfumes: [
                { field: "sku", headerName: "SKU", width: 110 },
                { field: "nombre", headerName: "Perfume", flex: 1, filter: true },
                { field: "genero", headerName: "Género", width: 120 },
                { field: "marca", headerName: "Marca", width: 130 },
                { field: "familia", headerName: "Familia Olfativa", flex: 1 },
                { field: "concentracion", headerName: "Concentración", width: 140 },
                { field: "precio_costo", headerName: "Costo ($)", width: 110, valueFormatter: p => `$${p.value?.toFixed(2)}` },
                { field: "precio_venta", headerName: "Venta ($)", width: 110, valueFormatter: p => `$${p.value?.toFixed(2)}` },
                { field: "stock", headerName: "Stock", width: 90, cellClass: p => p.value < 10 ? 'text-red-600 font-bold' : 'text-green-600' }
            ],
            marcas: [
                { field: "id_marca", headerName: "ID", width: 90 },
                { field: "nombre", headerName: "Nombre de la Marca", flex: 1, filter: true },
                { field: "pais_origen", headerName: "País de Origen", flex: 1 }
            ],
            familias: [
                { field: "id_familia", headerName: "ID", width: 90 },
                { field: "nombre", headerName: "Familia Olfativa", width: 200 },
                { field: "descripcion", headerName: "Descripción", flex: 1 }
            ],
            concentraciones: [
                { field: "id_concentracion", headerName: "ID", width: 90 },
                { field: "nombre", headerName: "Nombre Concentración", flex: 1 },
                { field: "siglas", headerName: "Siglas", width: 120 }
            ],
            clientes: [
                { field: "id_cliente", headerName: "ID", width: 90 },
                { field: "nombre", headerName: "Cliente", flex: 1, filter: true },
                { field: "telefono", headerName: "Teléfono", width: 150 },
                { field: "email", headerName: "Email", flex: 1 },
                { field: "tipo", headerName: "Tipo Cliente", width: 130 }
            ],
            proveedores: [
                { field: "id_proveedor", headerName: "ID", width: 90 },
                { field: "razon_social", headerName: "Razón Social / Proveedor", flex: 1, filter: true },
                { field: "rfc", headerName: "RFC", width: 140 },
                { field: "contacto", headerName: "Contacto", width: 160 },
                { field: "telefono", headerName: "Teléfono", width: 140 },
                { field: "email", headerName: "Email", flex: 1 }
            ],
            ventas: [
                { field: "id_venta", headerName: "Folio", width: 100 },
                { field: "cliente", headerName: "Cliente", flex: 1 },
                { field: "fecha_venta", headerName: "Fecha", width: 170 },
                { field: "metodo_pago", headerName: "Método Pago", width: 140 },
                { field: "total", headerName: "Total ($)", width: 120, valueFormatter: p => `$${p.value?.toFixed(2)}` },
                { field: "estado", headerName: "Estado", width: 120 }
            ],
            compras: [
                { field: "id_compra", headerName: "ID Compra", width: 110 },
                { field: "proveedor", headerName: "Proveedor", flex: 1 },
                { field: "folio_factura", headerName: "Factura", width: 150 },
                { field: "fecha_compra", headerName: "Fecha", width: 170 },
                { field: "total", headerName: "Total ($)", width: 120, valueFormatter: p => `$${p.value?.toFixed(2)}` },
                { field: "estado", headerName: "Estado", width: 120 }
            ]
        };

        // Metadatos de títulos
        const titulosModulos = {
            perfumes: { titulo: "Catálogo de Perfumes", sub: "Gestión de productos, precios y niveles de stock" },
            marcas: { titulo: "Marcas", sub: "Catálogo de marcas registradas" },
            familias: { titulo: "Familias Olfativas", sub: "Clasificación de esencias y notas olfativas" },
            concentraciones: { titulo: "Concentraciones", sub: "Categorías de pureza (EDT, EDP, Parfum, etc.)" },
            clientes: { titulo: "Catálogo de Clientes", sub: "Registro de clientes minoristas y mayoristas" },
            proveedores: { titulo: "Directorio de Proveedores", sub: "Proveedores e importadores registrados" },
            ventas: { titulo: "Histórico de Ventas", sub: "Registro de ventas generadas y facturadas" },
            compras: { titulo: "Registro de Compras", sub: "Órdenes de compra y recepción de inventario" }
        };

        // Inicializar AG Grid al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            const gridDiv = document.querySelector('#myGrid');
            const gridOptions = {
                columnDefs: configuracionColumnas.perfumes,
                rowData: [],
                pagination: true,
                paginationPageSize: 15,
                defaultColDef: {
                    sortable: true,
                    resizable: true
                }
            };
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
            cargarModulo('perfumes');
        });

        // Función para cambiar dinámicamente entre catálogos
        async function cargarModulo(nombreModulo) {
            moduloActual = nombreModulo;

            // Actualizar Títulos de la pantalla
            const meta = titulosModulos[nombreModulo] || { titulo: nombreModulo, sub: "" };
            document.getElementById('titulo-modulo').innerText = meta.titulo;
            document.getElementById('subtitulo-modulo').innerText = meta.sub;

            // Cambiar la estructura de columnas en AG Grid
            if (gridApi) {
                gridApi.setGridOption('columnDefs', configuracionColumnas[nombreModulo]);
                gridApi.showLoadingOverlay();
            }

            // Consultar datos al backend en Rust (Axum)
            try {
                const response = await fetch(`/api/catalogos/${nombreModulo}`);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const data = await response.json();
                gridApi.setGridOption('rowData', data);
            } catch (error) {
                console.error(`Error al cargar ${nombreModulo}:`, error);
                if (gridApi) gridApi.setGridOption('rowData', []);
            }
        }

        function recargarDatos() {
            cargarModulo(moduloActual);
        }
    </script>
</body>
</html>
