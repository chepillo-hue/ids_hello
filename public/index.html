<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Perfumería</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <div class="flex h-screen overflow-hidden">
    
    <!--  Sidebar / Menú Lateral -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
      <div class="p-5 font-bold text-xl border-b border-slate-800 flex items-center gap-2">
        <span>🌸</span> ERP Perfumería
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="#" class="block py-2.5 px-4 rounded bg-indigo-600 hover:bg-indigo-700 transition">
          🧪 Catálogo Perfumes
        </a>
        <a href="#" onclick="alert('Módulo de Ventas en desarrollo...')" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition text-gray-400">
          🛒 Ventas (Próximamente)
        </a>
        <a href="#" onclick="alert('Módulo de Inventario en desarrollo...')" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition text-gray-400">
          📦 Inventario (Próximamente)
        </a>
      </nav>
      <div class="p-4 text-xs text-slate-500 border-t border-slate-800">
        v1.0.0 — Despliegue Render
      </div>
    </aside>

    <!-- Área de Contenido Principal -->
    <main class="flex-1 flex flex-col overflow-y-auto">
      
      <!-- Topbar -->
      <header class="bg-white shadow-sm p-4 flex justify-between items-center">
        <h1 class="text-lg font-bold md:hidden">🌸 Perfumería ERP</h1>
        <div class="flex-1 hidden md:block"></div>
        <button onclick="abrirModalNuevo()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
          + Nuevo Perfume
        </button>
      </header>

      <!-- Vista de Contenido -->
      <div class="p-6 flex-1">
        <div class="mb-4">
          <h2 class="text-2xl font-bold text-gray-800">Catálogo de Perfumes</h2>
        </div>

        <!-- Tabla AG Grid (Escritorio) -->
        <div id="gridContainer" class="hidden md:block ag-theme-alpine w-full h-[500px] shadow rounded-lg overflow-hidden"></div>

        <!-- Vista Tarjetas (Móvil) -->
        <div id="mobileContainer" class="block md:hidden space-y-4"></div>
      </div>
    </main>

  </div>

  <!-- Modal para Crear / Editar Perfume -->
  <div id="modalPerfume" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
      <h3 class="text-lg font-bold mb-4" id="modalTitulo">Nuevo Perfume</h3>
      <form id="perfumeForm" onsubmit="guardarPerfume(event)" class="space-y-3">
        <input type="hidden" id="id_perfume">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase">SKU</label>
          <input type="text" id="sku" required class="w-full border p-2 rounded mt-1">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase">Nombre</label>
          <input type="text" id="nombre" required class="w-full border p-2 rounded mt-1">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase">Género</label>
          <select id="genero" class="w-full border p-2 rounded mt-1">
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
            <option value="Unisex">Unisex</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase">P. Costo</label>
            <input type="number" step="0.01" id="precio_costo" required class="w-full border p-2 rounded mt-1">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase">P. Venta</label>
            <input type="number" step="0.01" id="precio_venta" required class="w-full border p-2 rounded mt-1">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase">URL Imagen</label>
          <input type="text" id="imagen_url" class="w-full border p-2 rounded mt-1">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let gridApi = null;

    const columnDefs = [
      { 
        field: "imagen_url", 
        headerName: "Imagen", 
        width: 90,
        cellRenderer: (p) => p.value ? `<img src="${p.value}" class="h-8 w-8 object-cover rounded shadow my-1">` : '📷'
      },
      { field: "sku", headerName: "SKU", width: 120 },
      { field: "nombre", headerName: "Nombre del Perfume", flex: 1 },
      { field: "genero", headerName: "Género", width: 120 },
      { field: "precio_venta", headerName: "Precio Venta", width: 130, valueFormatter: p => `$${p.value}` },
      {
        headerName: "Acciones",
        width: 120,
        cellRenderer: (params) => {
          window[`perfume_${params.data.id_perfume}`] = params.data;
          return `
            <button onclick='abrirModalEditar(${params.data.id_perfume})' class="text-blue-600 hover:text-blue-800 mr-2">✏️</button>
            <button onclick="eliminarPerfume(${params.data.id_perfume})" class="text-red-600 hover:text-red-800">🗑️</button>
          `;
        }
      }
    ];

    async function cargarPerfumes() {
      try {
        const res = await fetch('/api/catalogos/perfumes');
        const data = await res.json();
        
        if (gridApi) {
          gridApi.setGridOption('rowData', data);
        } else {
          const gridDiv = document.querySelector('#gridContainer');
          gridApi = agGrid.createGrid(gridDiv, {
            columnDefs: columnDefs,
            rowData: data,
            pagination: true
          });
        }

        const mobileDiv = document.getElementById('mobileContainer');
        mobileDiv.innerHTML = data.map(p => `
          <div class="bg-white p-4 rounded-lg shadow border border-gray-100 flex justify-between items-center">
            <div>
              <h4 class="font-bold text-gray-900">${p.nombre}</h4>
              <p class="text-xs text-gray-500">${p.sku} | ${p.genero}</p>
              <p class="text-sm font-semibold text-emerald-600 mt-1">$${p.precio_venta}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="abrirModalEditar(${p.id_perfume})" class="p-2 text-blue-600">✏️</button>
              <button onclick="eliminarPerfume(${p.id_perfume})" class="p-2 text-red-600">🗑️</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error cargando perfumes:", err);
      }
    }

    async function guardarPerfume(e) {
      e.preventDefault();
      const id = document.getElementById('id_perfume').value;
      const body = {
        sku: document.getElementById('sku').value,
        nombre: document.getElementById('nombre').value,
        genero: document.getElementById('genero').value,
        precio_costo: parseFloat(document.getElementById('precio_costo').value),
        precio_venta: parseFloat(document.getElementById('precio_venta').value),
        imagen_url: document.getElementById('imagen_url').value || null
      };

      const url = id ? `/api/catalogos/perfumes/${id}` : '/api/catalogos/perfumes';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      cerrarModal();
      cargarPerfumes();
    }

    async function eliminarPerfume(id) {
      if (confirm('¿Deseas eliminar este perfume?')) {
        await fetch(`/api/catalogos/perfumes/${id}`, { method: 'DELETE' });
        cargarPerfumes();
      }
    }

    function abrirModalNuevo() {
      document.getElementById('perfumeForm').reset();
      document.getElementById('id_perfume').value = '';
      document.getElementById('modalTitulo').innerText = 'Nuevo Perfume';
      document.getElementById('modalPerfume').classList.remove('hidden');
      document.getElementById('modalPerfume').classList.add('flex');
    }

    function abrirModalEditar(id) {
      const p = window[`perfume_${id}`];
      if (!p) return;
      document.getElementById('id_perfume').value = p.id_perfume;
      document.getElementById('sku').value = p.sku;
      document.getElementById('nombre').value = p.nombre;
      document.getElementById('genero').value = p.genero;
      document.getElementById('precio_costo').value = p.precio_costo;
      document.getElementById('precio_venta').value = p.precio_venta;
      document.getElementById('imagen_url').value = p.imagen_url || '';
      document.getElementById('modalTitulo').innerText = 'Editar Perfume';
      document.getElementById('modalPerfume').classList.remove('hidden');
      document.getElementById('modalPerfume').classList.add('flex');
    }

    function cerrarModal() {
      document.getElementById('modalPerfume').classList.add('hidden');
      document.getElementById('modalPerfume').classList.remove('flex');
    }

    document.addEventListener('DOMContentLoaded', cargarPerfumes);
  </script>
</body>
</html>
